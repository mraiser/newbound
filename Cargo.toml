[workspace]
exclude = ["runtime", "scratch"]
resolver = "2"

[package]
name = "newbound"
version = "0.1.0"
edition = "2021"

[features]
serde_support = ["serde","serde_json","flowlang/serde_support","ndata/serde_support","newbound_core/serde_support"]
webview = ["wry","newbound_core/webview"]
java_runtime = ["flowlang/java_runtime","newbound_core/java_runtime"]
python_runtime = ["flowlang/python_runtime","newbound_core/python_runtime"]
javascript_runtime = ["flowlang/javascript_runtime","newbound_core/javascript_runtime"]

[dependencies]
newbound_core = { path = "./newbound_core" }

flowlang = { version="0.3.42" }
ndata = "0.3.17"

serde = { version = "^1.0", features = ["derive"], optional = true }
serde_json = { version = "^1.0", optional = true }
wry = { version="0.27.0", optional=true }

[[bin]]
name = "newbound"
path = "src/main.rs"

# flowlang 0.3.42 - the Python platform work - from mraiser/flow branch
# claude/bold-hawking-tqujwg until it is on crates.io. Once
# `cargo publish` has released it, delete this [patch] section and run
# `cargo update -p flowlang`: the requirements above already ask for 0.3.42.
[patch.crates-io]
flowlang = { git = "https://github.com/mraiser/flow", branch = "claude/bold-hawking-tqujwg" }
