     design, 2026-07-30): installing this ONE control installs the
     app-library module controls below. Each carries `module: true`, so
     api.js registers it as a named ES module on the page — order-free,
     the registry resolves inter-module imports whenever each arrives.
     The /dev/ boot and every brick (via the bridge) install this control
     to get the shared module world; there is no manifest anywhere. -->
