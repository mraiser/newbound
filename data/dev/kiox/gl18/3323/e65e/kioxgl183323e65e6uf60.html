<!-- dev — the Development app, as pure markup: the dev:plugins div runs
     the classic registry pass against this control (boot-level entries
     name their own selectors), and the frame is a stock mount like
     everything else. This control's real substance is its commands
     (compile, rebuild_lib, lib_archive, …). -->
<div class="data-control" data-control="dev:plugins" hidden></div> 
<div class="nb-bench-boot data-control" data-control="dev:frame"></div>
