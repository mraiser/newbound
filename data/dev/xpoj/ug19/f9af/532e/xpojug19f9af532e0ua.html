<aside class="nb-session" role="dialog" aria-label="Session">
  <div class="ss-grip" title="drag to resize the notebook"><span class="pill"></span></div>
  <header class="ss-head">
    <span class="lbl ss-title">▤ session</span>
    <span class="ss-sub">a notebook over your commands — every cell is a call, outputs stay put</span>
    <button class="ss-newctx" title="Insert a divider — conversation context resets here; the cells stay">─ new context</button>
    <button class="ss-wipe" title="Delete every cell in this notebook">wipe</button>
    <button class="ss-max" aria-pressed="false" title="Toggle full screen">◱ full</button>
    <button class="ss-close" aria-label="Close session">✕</button>
  </header>
  <div class="ss-body">
    <div class="ss-cells"></div>
    <div class="ss-new">
      <span class="ss-gutter">[·]</span>
      <input class="ss-call" placeholder="lib.control.command" autocomplete="off"
             aria-label="Command to run, as lib.control.command">
      <input class="ss-args" placeholder='args json, e.g. {"lib":"gudrun"}'
             aria-label="Arguments as JSON">
      <button class="ss-run">run ▸</button>
    </div>
    <!-- the plugin slot: the registry (dev.plugins) decides what, if
         anything, mounts here — the notebook doesn't know or care -->
    <div class="ss-plugins"></div>
    <div class="data-control" data-control="dev:plugins" hidden></div>
    <div class="ss-confirm" hidden>
      <span class="ss-confirm-msg"></span>
      <input class="ss-confirm-input" aria-label="Type the command name to confirm">
      <button class="ss-confirm-cancel">cancel</button>
    </div>
    <p class="ss-cap">Read-listed commands run directly. Anything else
    needs a writable connection and a typed confirmation — same rules as
    the bench.</p>
  </div>
</aside>
