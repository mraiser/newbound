<div class='hudtop'>
<div class='hudheader'>
  <button type='button' class='closehud roundbutton-small-white' aria-label='Close'><img src='../app/asset/app/icons/ui/dark/close.svg' alt=''></button>
  <div class='rp-info hudtitle'>
    <div class='headline rp-name'></div>
  </div>
  <div class='hudheadright'>
    <div class='rp-info hudconn'>
      <div class="connectionindicator"></div><div class="connectionindicator"></div><div class="connectionindicator"></div>
      <div class='connectionlatency'></div>
    </div>
    <button type='button' class='roundbutton-small-white popupmenu morebutton' aria-label='More actions' data-popup='{"selector":".control-settings-popup","closeselector":".control-settings-popup-close","popup":true}'><img src='../app/asset/app/icons/ui/dark/more-vertical.svg' alt=''></button>
    <div class='card popupcard mini control-settings-popup'>
      <table class="tablelist" role="presentation">
        <tr><td class="refreshhud closeonclick">Refresh</td></tr>
        <tr><td class="hudaddcontrol adminonly popupmenu closeonclick" data-popup='{"selector":".add-control-popup","closeselector":".add-control-popup-close","modal":true}'>Add Control</td></tr>
        <tr><td class="adminonly closeonclick">Control Settings</td></tr>
        <tr><td class="hudrestart adminonly closeonclick">Restart Services</td></tr>
      </table>
    </div>
  </div>
</div>
<div class="navbar-dark">
  <!-- D9: tab ids no tile would use — the generic tab1/tab2 collided with
       the camera tile's own LIVE/DVR/EVENTS tabs (its DVR content is
       .tab-content.tab2) -->
  <div class="navbar-tab navbar-hudtab-info selected" data-id='hudtab-info'>Info</div>
  <div class="navbar-tab navbar-hudtab-dash" data-id='hudtab-dash'>Dashboard</div>
</div>
</div>
  <div class='padme tab-content hudtab-info selected'>
    <div class='hudinfogrid'>
      <div class='hudinfolabel'>IP Address</div>
      <div class='hudinfovalue'><span class='hud_ipaddr'></span><span class='hud_addr_count hideme'></span><button type='button' class='roundbutton-small addressexpandbutton' aria-label='Show all addresses'><img src='../app/asset/app/icons/ui/accent/more.svg' alt=''></button><button type='button' class='roundbutton-small closeaddressbutton hideme' aria-label='Hide addresses'><img src='../app/asset/app/icons/ui/accent/close.svg' alt=''></button></div>
      <div class='hud_address_list addressexpand hudinfofull hideme'></div>
      <div class='hudinfolabel'>P2P Port</div>
      <div class='hudinfovalue hud_port'></div>
      <div class='hudinfolabel'>HTTP Port</div>
      <div class='hudinfovalue hud_http_port'></div>
      <div class='hudinfolabel hudcrates adminonly'>Platform</div>
      <div class='hudinfovalue hud_crates hudcrates adminonly'><i>checking...</i></div>
      <div class='hudcrateform hudinfofull hudcrates adminonly'>
        <input type='text' class='textinput hud_flowlang' placeholder='flowlang' style='width:90px;'>
        <input type='text' class='textinput hud_ndata' placeholder='ndata' style='width:90px;'>
        <button class='coloredbutton hudcrateupdate'>Update Crates</button>
        <button class='regularbutton hudcratehardreset'>Hard Reset</button>
        <button class='accentbutton hudcraterestart hideme'>Restart Instance</button>
      </div>
      <div class='hudcratestatus hudinfofull hudcrates adminonly hideme' style='white-space:pre-wrap; font-family:monospace; font-size:11px; max-height:120px; overflow:auto;'></div>
      <div class='hudinfolabel'><img src="../app/asset/app/icons/ui/dark/key.svg" class="icon-small-white" title="Groups this peer grants you" alt="Groups this peer grants you"></div>
      <div class='hudinfovalue rp-key'><i>checking...</i></div>
      <div class='hudinfolabel'><img src="../app/asset/app/icons/ui/dark/lock.svg" class="icon-small-white" title="Groups you grant this peer" alt="Groups you grant this peer"></div>
      <div class='hudinfovalue rp-lock'><i>checking...</i></div>
      <!-- P-2: the public key this instance holds for the peer, how it was
           obtained, and the two acts on it. The buttons act on THIS
           instance's record (peer.peer.peer_key), not on the remote peer. -->
      <div class='hudinfolabel'>Peer ID</div>
      <div class='hudinfovalue hudkey'>
        <span class='hudkey-val'><span class='hudkey-fp hud_uuid'></span><button type='button' class='roundbutton-small-white hudcopy' data-copy='id' data-what='peer ID' title='Copy the full peer ID' aria-label='Copy the full peer ID'><img src='../app/asset/app/icons/ui/dark/copy.svg' alt=''></button></span>
      </div>
      <div class='hudinfolabel'>Public Key</div>
      <div class='hudinfovalue hudkey'>
        <span class='hudkey-val'><span class='hudkey-fp hudkey-fpkey'></span><button type='button' class='roundbutton-small-white hudcopy hudcopy-key hideme' data-copy='publickey' data-what='public key' title='Copy the full public key' aria-label='Copy the full public key'><img src='../app/asset/app/icons/ui/dark/copy.svg' alt=''></button></span>
        <span class='hudkey-badge'></span>
      </div>
      <div class='hudinfofull hudkey-note hideme' role='status'></div>
      <div class='hudinfofull hudkey-actions'>
        <button type='button' class='regularbutton hudkey-verify hideme'>Mark verified</button>
        <button type='button' class='regularbutton hudkey-forget hideme'>Forget key</button>
        <span class='hudkey-status'></span>
      </div>
      <div class='hudinfofull'>
        <label class="plaincheckbox">
          <input type='checkbox' id='keepalive'>
          <span>Stay connected</span>
        </label>
        <span class='keepalive-status'></span>
      </div>
    </div>
    <div class='availableupgrades hideme'>
      The following libraries on <span class='rp-name'></span> can be updated:
      <br><br>
      <div class='upgradelist'></div>
      <div class='updatebuttons'>
        <br>
        <button class='coloredbutton updateall'>Update All</button>
        <button class='accentbutton cancelupdateall'>Cancel</button>
      </div>
    </div>
  </div>
  <div class='padme tab-content hudtab-dash'>
    <div class='hudeditbar adminonly'>
      <span class='hudedit-msg' role='status'></span>
      <button type='button' class='regularbutton hudeditbutton' aria-pressed='false'>Edit</button>
    </div>
    <div class='hudapps'></div>
  </div>
  <div class='add-control-popup card popup-card modal hideme'>
    <div class='dialog-header hud-dlg-head'>
      <span class='hud-dlg-title'>Add Control</span>
      <button type='button' class='add-control-popup-close roundbutton-small-white' aria-label='Close' title='Close'><img src='../app/asset/app/icons/ui/dark/close.svg' alt=''></button>
    </div>
    <div class='card-text'>
      <div class = 'add-control-available'></div>
      <div class='add-control-error'></div>
    </div>
  </div>
