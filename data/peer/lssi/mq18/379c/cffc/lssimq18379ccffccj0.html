<div class='data-control' data-control='app:ui:{}'></div> 
<div class='viewer'></div>
<!-- F18a: the plain peer list shown in place of the 3D view when WebGL is
     unavailable (or forced with ?view=list) -->
<div class='peerlistwrap' style='display:none;'>
  <div class='peerlistnote'></div>
  <div class='peerlist'></div>
</div>
<div class="wrap" style="display:none;">
  <div class='topleftcorner'>
    <div class='bigtext'>
      <div class='data-control' data-control='app:home:{}' style='display:contents'></div>
      <span class='nb-title'>Peers</span>
    </div>
  </div>
  <div class='bottomleftcorner'>
    <div class='localdevlabel'>Local Device</div>
    <div class='localdevinfo'>
      <div class='localpeername'></div>
      <div class='localpeerid'></div>
      <div class='localpeerport'></div>
      <div class='localhttpport'></div>
    </div>
    <div class='localcopystatus' role='status'></div>
    <div class='localdevactions'>
      <button type='button' class='copyinfobutton localdevbtn' title='Copy my connection info (ID, public key, address, port) to give to another device' aria-label='Copy my connection info'><img src='../app/asset/app/icons/ui/dark/copy.svg' class='mediumicon' alt=''></button>
      <button type='button' class='addpeerbutton localdevbtn popupmenu' title='Add connection' aria-label='Add connection' data-popup='{"selector":".addusercard","closeselector":".close-add-user","modal":true}'><img src='../app/asset/app/icons/ui/dark/user-add.svg' class='mediumicon' alt=''></button>
      <button type='button' class='updateallpeersbutton localdevbtn popupmenu' title='Update peers' aria-label='Update peers' data-popup='{"selector":".updateallpeerscard","closeselector":".close-update-peers","modal":true}'><img src='../app/asset/app/icons/ui/dark/upload.svg' class='mediumicon' alt=''></button>
    </div>
  </div>
  
  <div class='card hideme updateallpeerscard'>
    <div class='dialog-header'>
      <div class='padme'>
        <span class='peer-dlg-title'>Update Peers</span>
        <button type='button' class='upper-right close-update-peers roundbutton-small out10' aria-label='Close'><img src='../app/asset/app/icons/ui/dark/close.svg' alt=''></button>
      </div>
    </div>
    <div class='padme peerupdatelist'></div>
    <div class="card-button-wrap">
      <button id="updateallpeersnow"  class="clearbutton">Update Selected Peers</button>
    </div>
  </div>
  
  <div class='card hideme addusercard'>
    <div class='dialog-header'>
      <div class='padme'>
        <span class='peer-dlg-title'>Add Connection</span>
        <button type='button' class='upper-right close-add-user roundbutton-small out10' aria-label='Close'><img src='../app/asset/app/icons/ui/dark/close.svg' alt=''></button>
      </div>
      <div class = "navbar navbar-dark addusernavbar">
        <div class = "navbar-tab autab autab1 selected" data-id='autab1'>LAN</div>
        <div class = "navbar-tab autab autab2" data-id='autab2'>Connect</div>
      </div>
    </div>
    <div class='tab-content autab1 selected' id='autab1'>
        <div class="discovered"></div>
    </div>
    <div class='tab-content autab2' id='autab2'>
      <div class='padme'>
        <!-- D8: a two-column grid (css .adduserform) in place of the old
             <table>, whose columns were spaced with different <br>
             patterns so no row shared a top edge. Row order: Name | IP,
             UUID | Port, Group | Keep Alive. The UUID input keeps its
             plain wrapper div: the js paints the validation border on
             the input's parentElement. -->
        <div class='adduserform'>
          <!-- P-2: the offline exchange. The other device's Copy my
               connection info string fills every field below, key included. -->
          <div class='aufield aufield-full'>
            <label class='textinputlabel' for='au-paste'>Connection info (paste what the other device copied)</label>
            <input type='text' class='textinput adduserpaste' id='au-paste' autocomplete='off' spellcheck='false'>
          </div>
          <div class='aufield aufield-full'>
            <label class='textinputlabel' for='au-key'>Public Key (if you have it)</label>
            <div><input type='text' class='textinput adduserkey' id='au-key' autocomplete='off' spellcheck='false'></div>
            <div class='adduserkeywarn' role='status'>No key given. Unless a peer you already trust knows this device, the first device that answers as this ID will be trusted. You can check its key afterwards on the peer's Info tab.</div>
          </div>
          <div class='aufield'>
            <label class='textinputlabel' for='au-name'>Device Name</label>
            <input type='text' class='textinput addusername' id='au-name' autocomplete='off'>
          </div>
          <div class='aufield'>
            <label class='textinputlabel' for='au-ip'>IP Address (if you have it)</label>
            <input type='text' class='textinput adduseripaddr' id='au-ip' autocomplete='off'>
          </div>
          <div class='aufield'>
            <label class='textinputlabel' for='au-uuid'>Device UUID</label>
            <div><input type='text' class='textinput adduseruuid' id='au-uuid' autocomplete='off' spellcheck='false'></div>
          </div>
          <div class='aufield'>
            <label class='textinputlabel' for='au-port'>Port Number (if you have it)</label>
            <input type='number' class='textinput adduserport' id='au-port' autocomplete='off' inputmode='numeric'>
          </div>
          <div class='aufield'>
            <label class='textinputlabel' for='au-group'>Select Group</label>
            <select class='textinput groupselect addusergroup' id='au-group'></select>
          </div>
          <div class='aufield aufield-check'>
            <label class="plaincheckbox">
              <input type='checkbox' id='useraddkeepalive' checked>
              <span>Keep Connection Alive</span>
            </label>
          </div>
        </div>
      </div>
      <div class="card-button-wrap">
        <button id="addconnection"  class="clearbutton">Add Connection</button>
      </div>
    </div>
    
  
  </div>  
</div>
<div id="headsupdisplay" class="wrap">
  
</div>
<!-- 7b: the panel's drag handle. A SIBLING pinned to the panel's left
     edge, not a child: the panel scrolls (overflow-y), so an absolute
     child would ride the content up out of view. -->
<div id="hudresizer" class="hudresizer" style="display:none;"></div>
