name: release

# Self-contained bundles with Python embedded (packaging/bundle.sh): built
# for every v* tag, and attached to that tag's GitHub release. A change to
# the packaging, or a manual run, builds them as workflow artifacts only.
on:
  push:
    tags: ["v*"]
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the bundle (includes a smoke test)
        run: packaging/bundle.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: newbound-${{ matrix.target }}
          path: dist/newbound-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz --repo "${GITHUB_REPOSITORY}" --generate-notes
