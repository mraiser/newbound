name: release

# Self-contained bundles with Python embedded (packaging/bundle.sh), each
# also as a -js variant with the JavaScript runtime: built for every v* tag,
# and attached to that tag's GitHub release. A change to the packaging, or a
# manual run, builds them as workflow artifacts only.
on:
  push:
    # tags always build; on a branch, only a change to the packaging does
    # (path filters apply to branch pushes, not to tag pushes)
    tags: ["v*"]
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
        # "": the default bundle; js: newbound-<target>-js, with the
        # JavaScript runtime (packaging/BUNDLE.md)
        variant: ["", "js"]
    name: bundle (${{ matrix.platform.target }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    env:
      NAME: newbound-${{ matrix.platform.target }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the bundle (includes the smoke tests)
        run: packaging/bundle.sh ${{ matrix.platform.target }} dist ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz --repo "${GITHUB_REPOSITORY}" --generate-notes
